name: Release draft
run-name: Release ${{ github.ref_name }} at ${{ github.sha }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Install Android SDK Platform 37.0
        run: sdkmanager --install "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py check --tag "$RELEASE_TAG"
      - name: Test Python integrations
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Test Node launcher
        run: npm test
      - name: Validate npm package
        run: npm pack --dry-run
      - name: Build and check Android release
        run: bash ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'
      - uses: actions/download-artifact@v7
        with:
          name: unsigned-apk
          path: unsigned
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          KEYSTORE_FILE="$RUNNER_TEMP/phoneuse-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE_FILE" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/PhoneUse.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/PhoneUse.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/PhoneUse.apk"
      - name: Assemble public assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py bundle --tag "$RELEASE_TAG" --apk "$RUNNER_TEMP/PhoneUse.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist/release
      - name: Create draft (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --draft --title "Phone Use $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
